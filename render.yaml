# Render Blueprint - Gola Grocery
# Render dashboard -> New -> Blueprint -> pick this repo. Values marked "sync: false" are asked for once in the dashboard.
services:
  # ---------------------------------------------------------------- Spring Boot API
  - type: web
    name: gola-grocery-api
    runtime: docker
    plan: free
    region: singapore              # closest Render region to India
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DB_URL                # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET            # random secret generated by Render
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGINS          # the admin site URL, e.g. https://gola-grocery-admin.onrender.com
        sync: false
      - key: OTP_DEV_ECHO          # true = OTP shown in the app (no SMS provider yet). Set false once SMS is integrated.
        value: "true"
      - key: PAYMENTS_MODE         # mock until Razorpay keys are added
        value: mock
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE
        value: "5"
      # Email OTP via Brevo (free plan). Username/password = Brevo SMTP login + SMTP key; MAIL_FROM = your verified sender email.
      - key: SPRING_MAIL_HOST
        value: smtp-relay.brevo.com
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

  # ---------------------------------------------------------------- Admin dashboard (static site, never sleeps)
  - type: web
    name: gola-grocery-admin
    runtime: static
    buildCommand: cd admin-dashboard && npm ci --no-audit --no-fund && npm run build
    staticPublishPath: ./admin-dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL     # the API URL WITHOUT trailing slash, e.g. https://gola-grocery-api.onrender.com
        sync: false
