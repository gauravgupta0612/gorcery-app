# Render Blueprint - Gola Grocery
# Render dashboard -> New -> Blueprint -> pick this repo. Values marked "sync: false" are asked for once in the dashboard.
services:
  # ---------------------------------------------------------------- Spring Boot API
  - type: web
    name: gola-grocery-api
    runtime: docker
    plan: free
    region: singapore              # closest Render region to India
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DB_URL                # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET            # random secret generated by Render
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGINS          # the admin site URL, e.g. https://gola-grocery-admin.onrender.com
        sync: false
      - key: OTP_DEV_ECHO          # false = OTP is only emailed (production). true shows it on screen - testing only.
        value: "false"
      - key: PAYMENTS_MODE         # razorpay (live keys in RAZORPAY_* below). mock = fake payments for local dev.
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE
        value: "5"
      # Email OTP: Render free blocks SMTP ports, so mail goes through the HTTPS relay in scripts/gmail-otp-relay.gs
      - key: MAIL_RELAY_URL
        sync: false
      - key: MAIL_RELAY_SECRET
        sync: false

  # ---------------------------------------------------------------- Admin dashboard (static site, never sleeps)
  - type: web
    name: gola-grocery-admin
    runtime: static
    buildCommand: cd admin-dashboard && npm ci --no-audit --no-fund && npm run build
    staticPublishPath: ./admin-dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL     # the API URL WITHOUT trailing slash, e.g. https://gola-grocery-api.onrender.com
        sync: false

  # ---------------------------------------------------------------- Public website (product list + policy pages for Razorpay)
  - type: web
    name: gola-grocery-web
    runtime: static
    buildCommand: echo "static site - regenerate with python scripts/build_website.py"
    staticPublishPath: ./website
