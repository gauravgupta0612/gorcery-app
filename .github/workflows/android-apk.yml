name: Android APK

on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend URL the app should call (must end with /), e.g. http://192.168.1.20:8095/'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Choose backend URL
        run: |
          URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$URL" ]; then URL="${{ vars.GOLA_API_BASE_URL }}"; fi
          if [ -z "$URL" ]; then URL="http://10.0.2.2:8095/"; fi
          echo "API_URL=$URL" >> "$GITHUB_ENV"
          echo "App will call: $URL"

      - name: Unit tests + debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug -PgolaApiBaseUrl="$API_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: gola-grocery-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk

      - name: Publish APK as a GitHub release (download straight to your phone)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GolaGrocery-debug.apk
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest GolaGrocery-debug.apk --prerelease \
            --title "Gola Grocery - latest debug APK" \
            --notes "Built from commit ${GITHUB_SHA::7}. Backend URL baked into the app: $API_URL"
