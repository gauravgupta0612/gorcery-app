name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'database/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        working-directory: backend
        run: |
          set -o pipefail
          mvn -B -ntp package 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        working-directory: backend
        run: |
          f=build.log
          [ -f "$f" ] || exit 0
          grep -nE "^e: |error:|ERROR|FAILED|What went wrong|Caused by|Exception|expected|but was|Tests run:.*Fail|> Task .*FAILED|cannot find symbol|symbol:|location:" "$f" | head -150 > errs.txt || true
          [ -s errs.txt ] || tail -80 "$f" > errs.txt
          body=$(sed -e 's/%/%25/g' errs.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::$body"

      - uses: actions/upload-artifact@v4
        with:
          name: gola-grocery-backend-jar
          path: backend/target/gola-grocery-backend-*.jar
