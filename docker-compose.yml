# Local full stack:  docker compose --env-file backend/.env up --build
# Services: PostgreSQL 16, Spring Boot API (port 8095), admin dashboard (port 5173 -> nginx)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gola_grocery
      POSTGRES_USER: ${DB_USERNAME:-gola}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports: ["5432:5432"]
    volumes: [gola-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gola} -d gola_grocery"]
      interval: 5s
      retries: 20

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DB_URL: jdbc:postgresql://db:5432/gola_grocery
      DB_USERNAME: ${DB_USERNAME:-gola}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OTP_DEV_ECHO: ${OTP_DEV_ECHO:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-mock}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      FIREBASE_CREDENTIALS_FILE: ${FIREBASE_CREDENTIALS_FILE:-}
    ports: ["8095:8095"]
    volumes: [gola-uploads:/app/uploads]

  admin:
    build: { context: admin-dashboard }
    depends_on: [backend]
    ports: ["5173:80"]

volumes:
  gola-db:
  gola-uploads:
