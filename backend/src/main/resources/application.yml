# All secrets come from environment variables (see backend/.env.example). Nothing secret is hardcoded.
server:
  port: ${PORT:8095}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: gola-grocery
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gola_grocery}
    username: ${DB_USERNAME:gola}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # Flyway owns the schema
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
        default_batch_fetch_size: 64
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Email OTP. Set SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD in the environment
  # (e.g. Brevo: smtp-relay.brevo.com:587). Without SPRING_MAIL_HOST no email is sent.
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints.web.exposure.include: health,info
  health.mail.enabled: false            # don't let an unreachable SMTP server make /actuator/health slow or DOWN

springdoc:
  swagger-ui.path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:}                    # REQUIRED: >= 32 random bytes (base64 or plain text)
    access-token-minutes: ${JWT_ACCESS_MINUTES:60}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
  mail:
    relay-url: ${MAIL_RELAY_URL:}             # HTTPS email relay (Google Apps Script) - works where SMTP ports are blocked (Render free)
    relay-secret: ${MAIL_RELAY_SECRET:}
    smtp-enabled: ${MAIL_SMTP_ENABLED:false}  # set true only on hosts that allow outbound SMTP
    from: ${MAIL_FROM:}                       # verified sender address, e.g. your Brevo login email
  otp:
    length: 6
    ttl-minutes: 5
    max-attempts: 5
    dev-echo: ${OTP_DEV_ECHO:false}          # true = return OTP in API response (local development only)
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  storage:
    dir: ${STORAGE_DIR:./uploads}
    seed-dir: ${SEED_IMAGES_DIR:../database/seed-images}
  public-base-url: ${PUBLIC_BASE_URL:https://gola-grocery-api.onrender.com}   # used in invoice download links
  whatsapp:                                 # Meta WhatsApp Business Cloud API (invoice on WhatsApp). Empty = disabled.
    token: ${WHATSAPP_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    invoice-template: ${WHATSAPP_INVOICE_TEMPLATE:order_invoice}
    language: ${WHATSAPP_TEMPLATE_LANGUAGE:en}
  payments:
    mode: ${PAYMENTS_MODE:mock}               # razorpay | mock (mock = clearly-labelled TEST payments for local dev)
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  firebase:
    credentials-file: ${FIREBASE_CREDENTIALS_FILE:}   # path to service-account JSON; empty = log notifications only
  bootstrap-admin:
    phone: ${ADMIN_PHONE:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Store Admin}
